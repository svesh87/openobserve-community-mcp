name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "*.*.*"
  pull_request:

permissions:
  contents: read

env:
  # The server holds credentials to an observability platform and is reached over a port,
  # so the transport and the client are the parts that must not rot unnoticed. The
  # threshold is checked by the job rather than left to a reviewer's eye.
  COVERAGE_THRESHOLD: "80"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6

      - name: Install package
        run: uv pip install --system -e . coverage

      - name: Run unit tests with coverage
        run: |
          coverage run --source=openobserve_mcp -m unittest discover -s tests -p 'test_*.py'
          coverage report --fail-under="${COVERAGE_THRESHOLD}"

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Build distribution
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: openobserve-community-mcp:ci

      - name: Verify container entrypoint
        run: docker run --rm openobserve-community-mcp:ci config-path
